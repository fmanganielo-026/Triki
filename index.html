<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Triki Arcade — juego de Triki 3x3" />
    <title>Triki Arcade</title>

    <!-- Bootstrap 5 (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- Estilos propios -->
    <link href="css/styles.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Fondo decorativo (rejilla sutil estilo arcade) -->
    <div class="bg-grid" aria-hidden="true"></div>

    <main class="container app">
      <!-- ===================== CABECERA ===================== -->
      <header class="app-header text-center">
        <button
          id="btnSound"
          class="sound-btn"
          type="button"
          aria-label="Activar o desactivar sonido"
          title="Sonido"
        >
          <i class="bi bi-volume-up-fill" aria-hidden="true"></i>
        </button>

        <h1 class="app-title">TRIKI <span class="neon-x">ARCADE</span></h1>
        <p class="app-subtitle">Clásico 3&times;3 &middot; modo retro neon</p>
      </header>

      <div class="row justify-content-center g-4">
        <!-- ===================== COLUMNA PRINCIPAL ===================== -->
        <div class="col-12 col-lg-7">
          <!-- Modo de juego -->
          <section class="panel">
            <h2 class="panel-title">
              <i class="bi bi-joystick" aria-hidden="true"></i> Modo de juego
            </h2>

            <div
              class="segmented"
              role="group"
              aria-label="Seleccionar modo de juego"
            >
              <button
                type="button"
                class="seg-btn active"
                data-mode="pvp"
                aria-pressed="true"
              >
                <i class="bi bi-people-fill" aria-hidden="true"></i> 2 Jugadores
              </button>
              <button
                type="button"
                class="seg-btn"
                data-mode="pvc"
                aria-pressed="false"
              >
                <i class="bi bi-cpu" aria-hidden="true"></i> vs Computadora
              </button>
            </div>

            <!-- Dificultad: solo aparece en modo contra computadora -->
            <div id="difficultyBox" class="difficulty-box d-none">
              <h3 class="panel-subtitle">Dificultad</h3>

              <div
                class="segmented segmented--sm"
                role="group"
                aria-label="Seleccionar dificultad"
              >
                <button
                  type="button"
                  class="seg-btn"
                  data-difficulty="easy"
                  aria-pressed="false"
                >
                  Fácil
                </button>
                <button
                  type="button"
                  class="seg-btn active"
                  data-difficulty="medium"
                  aria-pressed="true"
                >
                  Medio
                </button>
                <button
                  type="button"
                  class="seg-btn"
                  data-difficulty="hard"
                  aria-pressed="false"
                >
                  Difícil
                </button>
              </div>

              <p id="difficultyInfo" class="difficulty-info"></p>
            </div>
          </section>

          <!-- Estado + tablero -->
          <section class="panel board-panel">
            <!-- Mensaje de estado (turno / ganador / empate / pensando) -->
            <div
              id="statusBox"
              class="status-box is-turn-x"
              role="status"
              aria-live="polite"
            >
              <span id="statusText">Turno de X</span>
              <span class="thinking-dots" aria-hidden="true"
                ><span></span><span></span><span></span
              ></span>
            </div>

            <!-- Indicador de turno -->
            <div id="turnIndicator" class="turn-indicator">
              <span class="turn-label">Turno de</span>
              <span id="turnSymbol" class="turn-symbol sym-x">X</span>
            </div>

            <!-- Tablero (las casillas las crea JavaScript) -->
            <div
              id="board"
              class="board"
              role="group"
              aria-label="Tablero de Triki, 3 por 3"
            ></div>

            <!-- Controles de partida -->
            <div class="board-actions">
              <button id="btnNewGame" type="button" class="btn btn-neon">
                <i class="bi bi-arrow-repeat" aria-hidden="true"></i> Nueva
                partida
              </button>
            </div>
          </section>
        </div>

        <!-- ===================== COLUMNA LATERAL ===================== -->
        <div class="col-12 col-lg-5">
          <!-- Marcador -->
          <section class="panel">
            <h2 class="panel-title">
              <i class="bi bi-trophy-fill" aria-hidden="true"></i> Marcador
            </h2>

            <div class="score-grid">
              <div class="score-card score-card--x">
                <span class="score-symbol">X</span>
                <strong id="scoreX" class="score-value">0</strong>
              </div>
              <div class="score-card score-card--draw">
                <span class="score-symbol draw">EMP</span>
                <strong id="scoreDraw" class="score-value">0</strong>
              </div>
              <div class="score-card score-card--o">
                <span class="score-symbol">O</span>
                <strong id="scoreO" class="score-value">0</strong>
              </div>
            </div>

            <button
              id="btnResetScore"
              type="button"
              class="btn btn-ghost w-100"
            >
              <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
              Reiniciar marcador
            </button>
          </section>

          <!-- Historial de la partida actual -->
          <section class="panel history-panel">
            <h2 class="panel-title">
              <i class="bi bi-list-ol" aria-hidden="true"></i> Historial
            </h2>
            <ol
              id="historyList"
              class="history-list"
              aria-label="Historial de movimientos de la partida actual"
            ></ol>
          </section>
        </div>
      </div>

      <footer class="app-footer text-center">Maria Fernanda Jaimes</footer>
    </main>

    <!-- Bootstrap JS (bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica del juego -->
    <script src="js/app.js"></script>
  </body>
</html>
